name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run regression checks
        run: python -B tests/check.py
      - name: Install plotting dependency
        run: python -m pip install -r requirements.txt
      - name: Render analysis figures
        run: python -B tests/analysis_smoke.py
